server {
  listen 80;
  listen [::]:80;
  server_name ${PUBLIC_HOST};

  root /opt/google-drive-server/frontend/dist;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
  }

  location /files/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_buffering off;
  }
}
